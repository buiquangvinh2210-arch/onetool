<body data-tool="vietqr">
<div id="site-header"></div>
<main role="main">
<nav id="otCrumb" class="ot-crumb-wrap container" aria-label="Breadcrumb"></nav>
<section class="tool-workspace tool-workspace--doc">
  <div class="vqr-page">
    <header class="vqr-intro">
      <h1>Tạo mã VietQR chuyển khoản</h1>
      <p>Chuẩn NAPAS: chọn ngân hàng, STK, số tiền (tuỳ chọn) — tải PNG để in hoặc gửi khách quét app.</p>
    </header>
    <div class="vqr-card">
      <div class="vqr-grid">
        <div class="vqr-form">
          <label class="vqr-label" for="bank">Ngân hàng</label>
          <select id="bank"></select>
          <label class="vqr-label" for="account">Số tài khoản</label>
          <input id="account" inputmode="numeric" autocomplete="off" placeholder="Số tài khoản nhận tiền" />
          <label class="vqr-label" for="accName">Tên chủ tài khoản (in trên ảnh)</label>
          <input id="accName" autocomplete="off" placeholder="NGUYEN VAN A" />
          <label class="vqr-label" for="amount">Số tiền (VND, để trống = người chuyển tự nhập)</label>
          <input id="amount" inputmode="numeric" placeholder="50000" />
          <label class="vqr-label" for="memo">Nội dung CK (không dấu, tối đa 25 ký tự)</label>
          <input id="memo" maxlength="40" placeholder="Thanh toan don hang" />
          <button type="button" class="btn btn-primary btn-block" id="runBtn" style="margin-top:1rem">Tạo VietQR</button>
          <div class="vqr-actions">
            <button type="button" class="btn btn-outline btn-sm" id="copyBtn" disabled>Sao chép ảnh</button>
            <button type="button" class="btn btn-primary btn-sm" id="downloadBtn" disabled>Tải PNG</button>
          </div>
        </div>
        <div class="vqr-preview">
          <div class="vqr-empty" id="qrEmpty">Mã VietQR hiện ở đây<br />sau khi bạn bấm Tạo</div>
          <div id="preview" hidden></div>
          <p id="status" class="vqr-status">Sẵn sàng — điền STK rồi tạo mã.</p>
          <textarea id="payload" class="vqr-payload" rows="3" readonly aria-label="Chuỗi VietQR"></textarea>
        </div>
      </div>
    </div>
  </div>
</section>
<section class="tool-seo" id="toolSeo"></section>
</main>
<div id="site-footer"></div>
