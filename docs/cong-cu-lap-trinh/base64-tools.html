<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/assets/img/favicon-48.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" sizes="180x180" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encode Decode Base64 UTF-8 online — tiếng Việt, file, ảnh | OneTool</title>
  <meta name="description" content="Encode/decode Base64 hỗ trợ tiếng Việt, URL-safe và Data URL. Mở file hoặc dán chuỗi, xem preview ảnh — miễn phí." />
  <meta name="robots" content="index,follow" />
  <link rel="stylesheet" href="../assets/css/site.css?v=20260826c" />
  <link rel="stylesheet" href="../assets/css/components.css?v=20260824d" />
  <link rel="stylesheet" href="../assets/css/ot-shell.css?v=20260826e" />
  <link rel="stylesheet" href="../assets/css/tools/base64-tools.css" />
  <script>window.OT_BASE = "..";</script>
  <style id="ot-fouc">#site-header{min-height:72px;display:block;contain:layout style}
#site-footer{min-height:320px;display:block;contain:layout style}
#otCrumb,.ot-crumb-wrap{min-height:48px;display:block}
@media(max-width:900px){#site-header{min-height:56px}#site-footer{min-height:400px}}</style></head>
<body>
<div id="site-header"></div>
<main role="main">
<nav id="otCrumb" class="ot-crumb-wrap" aria-label="Breadcrumb"></nav>
<section class="tool-workspace tool-workspace--doc">
  <div class="b64-page">
    <header class="b64-intro">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/assets/img/favicon-48.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" sizes="180x180" />
      <h1>Base64 · Mã hóa / giải mã</h1>
      <p id="introDesc"></p>
    </header>

    <div class="b64-studio">
      <div class="b64-panel">
        <div class="b64-panel-head">
          <h2 id="lblSource"></h2>
          <div class="b64-mode" id="modeTabs" role="tablist">
            <button type="button" class="is-on" data-mode="encode" role="tab" aria-selected="true">Encode</button>
            <button type="button" data-mode="decode" role="tab" aria-selected="false">Decode</button>
          </div>
        </div>
        <div class="b64-body">
          <div class="b64-meta">
            <span id="inputMeta"></span>
            <span id="validBadge"></span>
          </div>
          <div class="b64-options">
            <label><input type="checkbox" id="urlSafe" /> URL-safe</label>
            <label id="dataUrlWrap"><input type="checkbox" id="dataUrl" /> Data URL</label>
            <label id="wrapLinesWrap"><input type="checkbox" id="wrapLines" checked /> <span id="lblWrapLines"></span></label>
          </div>
          <textarea id="inputText" class="b64-editor" spellcheck="false"></textarea>
          <div class="b64-file-chip" id="fileChip" hidden></div>
          <div class="b64-toolbar">
            <button type="button" class="b64-text-btn" id="openFileBtn"></button>
            <button type="button" class="b64-text-btn" id="sampleBtn"></button>
            <button type="button" class="b64-text-btn" id="swapBtn"></button>
            <button type="button" class="b64-text-btn" id="clearBtn"></button>
            <input type="file" id="fileInput" />
          </div>
          <button type="button" class="btn btn-primary btn-block" id="runBtn"></button>
        </div>
      </div>

      <div class="b64-panel result-panel">
        <div class="b64-panel-head">
          <h2 id="lblResult"></h2>
          <div class="b64-actions">
            <button type="button" class="btn btn-outline btn-sm" id="copyResultBtn" disabled></button>
            <button type="button" class="btn btn-primary btn-sm" id="downloadResultBtn" disabled></button>
          </div>
        </div>
        <div class="b64-body">
          <p id="status" class="b64-status"></p>
          <pre id="preview" class="b64-out is-empty"></pre>
          <div class="b64-preview" id="imgPreview"><img id="imgOut" alt="Preview" /></div>
        </div>
      </div>
    </div>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="../assets/js/catalog.js"></script>
<script src="../assets/js/layout.js?v=20260826g"></script>
<script src="../assets/js/core.js?v=20260826a"></script>
<script src="../assets/js/site.js?v=20260826g"></script>
<script src="../assets/js/tools/utils.js?v=20260824a" defer></script>
<script src="../assets/js/tools/base64-tools-ui.js?v=20260824a" defer></script>
</body>
</html>
