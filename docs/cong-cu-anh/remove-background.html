  <title>Xóa nền ảnh online miễn phí — PNG trong suốt | OneTool</title>
  <meta name="description" content="Xóa nền ảnh online bằng AI: tách người, sản phẩm khỏi phông, xem preview, tải PNG trong suốt. Miễn phí." />

  <link rel="preload" href="../assets/css/ot-shell.css?v=20260826p" as="style" />
  <link rel="stylesheet" href="../assets/css/ot-shell.css?v=20260826p" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="../assets/css/ot-shell.css?v=20260826p"></noscript>

  <script>window.OT_BASE = "..";</script>
  <style id="ot-fouc">#site-header{min-height:72px;display:block;contain:layout style}
#site-footer{min-height:320px;display:block;contain:layout style}
#otCrumb,.ot-crumb-wrap{min-height:48px;display:block}
body[data-tool="remove-background"] .rb-work{display:none!important}
body[data-tool="remove-background"] .rb-shell.has-file .rb-work{display:grid!important}
body[data-tool="remove-background"] .rb-shell.has-file .rb-drop{display:none!important}
@media(max-width:1024px){#site-header{min-height:56px}#site-footer{min-height:400px}}</style>

<body data-tool="remove-background">
<div id="site-header"></div>
<main role="main">
<nav id="otCrumb" class="ot-crumb-wrap" aria-label="Breadcrumb"></nav>
<section class="tool-workspace tool-workspace--doc">
  <div class="rb-page">
    <header class="rb-intro">
      <h1>Xóa nền ảnh online</h1>
      <p>Tách nền ảnh bằng AI, xem preview, xuất PNG trong suốt — miễn phí.</p>
    </header>

    <div class="rb-shell" id="shell">
      <div class="rb-drop">
        <div class="upload-zone" id="uploadZone" data-kind="image">
          <input type="file" id="fileInput" accept="image/*,.jpg,.jpeg,.png,.webp" hidden />
          <div class="upload-placeholder">
            <p class="rb-drop-kicker">Thả ảnh vào đây</p>
            <p class="rb-drop-sub">hoặc <button type="button" class="link-btn" id="browseBtn">chọn từ máy</button> · JPG PNG WebP · tối đa 8&nbsp;MB</p>
          </div>
        </div>
      </div>

      <div class="rb-work">
        <figure class="rb-shot">
          <figcaption>
            <span>Gốc</span>
            <button type="button" class="rb-text-btn" id="changeBtn">Đổi ảnh</button>
          </figcaption>
          <div class="rb-frame" id="sourceBox">
            <img id="sourceImg" alt="Ảnh gốc" hidden />
          </div>
          <p id="sourceMeta" class="rb-file"></p>
        </figure>

        <div class="rb-mid">
          <button type="button" class="rb-run" id="runBtn" disabled>Xóa nền</button>
        </div>

        <figure class="rb-shot">
          <figcaption>
            <span>PNG</span>
            <span id="status" class="rb-status">Chờ xử lý</span>
          </figcaption>
          <div id="preview" class="rb-frame rb-frame--out" data-bg="check">
            <div class="rb-wait" id="resultEmpty">Kết quả hiện ở đây</div>
          </div>
          <div class="rb-out-bar" id="outBar" hidden>
            <div class="rb-bg-toggle" id="bgToggle">
              <button type="button" data-bg="check" class="is-on">Caro</button>
              <button type="button" data-bg="light">Sáng</button>
              <button type="button" data-bg="dark">Tối</button>
            </div>
            <div class="rb-actions">
              <button type="button" class="rb-text-btn" id="copyResultBtn" disabled>Sao chép</button>
              <button type="button" class="rb-text-btn rb-text-btn--strong" id="downloadResultBtn" disabled>Tải PNG</button>
            </div>
          </div>
        </figure>
      </div>

      <div class="rb-progress" id="otProgress" aria-hidden="true"><span></span></div>
    </div>
  </div>
</section>
<section class="tool-seo" id="toolSeo"></section>
</main>
<div id="site-footer"></div>
<script src="../assets/js/catalog.js?v=20260828h"></script>
<script src="../assets/js/layout.js?v=20260828f"></script>
<script src="../assets/js/core.js?v=20260826a"></script>
<script src="../assets/js/site.js?v=20260828d"></script>
<script src="../assets/js/tools/image.js?v=20260824g" defer></script>
<script src="../assets/js/tools/remove-background-ui.js?v=20260828b" defer></script>
</body>
</html>
